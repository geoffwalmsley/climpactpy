[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climpactpy"
description = "Python port of Climpact: indices of daily climate extremes for station and gridded data"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "xclim>=1.0,<1.1",
    "xarray>=2025.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "dask>=2024.1",
    "netCDF4>=1.7",
]

[project.scripts]
climpact = "climpact.cli:main"

[project.optional-dependencies]
# Index plots, the combined PDF (climpact.plots; `climpact run --plots`)
plots = [
    "matplotlib>=3.8",
]

[dependency-groups]
# The core's development tools (PEP 735; `uv sync --package climpactpy`, or
# `pip install --group dev` with pip 25.1+). The root pyproject.toml's group has these too.
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/geoffwalmsley/climpactpy"
"Original R Climpact" = "https://github.com/ARCCSS-extremes/climpact"

[tool.hatch.version]
path = "src/climpact/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/climpact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE --strict-markers"
markers = [
    "parity: comparison against the R reference outputs",
]
filterwarnings = [
    # cf_xarray warns when matplotlib is not installed (it is optional: the plots extra)
    "ignore:Import\\(s\\) unavailable to set up matplotlib support:UserWarning",
]

[tool.ruff]
# Shared settings for the whole repository (reference/ scripts and both packages)
extend = "../../ruff.toml"
