{% load i18n ui %}{# Toast region: ui.js adds toasts here (Climpact.toast(), or an HX-Trigger "toast" event). #}
<ul class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></ul>
<template id="toast-template">
  <li class="alert toast">
    <span data-toast-icon></span>
    <div class="alert__body"><p data-toast-message></p></div>
    <button type="button" class="button button--ghost button--sm button--icon alert__close" data-toast-close>{% icon "close" %}<span class="visually-hidden">{% translate "Dismiss" %}</span></button>
  </li>
</template>
<template id="toast-icons">{% icon "info" %}{% icon "check-circle" %}{% icon "warning" %}{% icon "error" %}</template>
