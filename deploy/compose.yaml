# The hosted climpact-web stack on one Droplet (#121): web, worker, Postgres, the daily
# purge, the deploy hook (#126) and the Cloudflare Tunnel connector. See TECHNICAL.md › Deployment › Compose stack.
#
#   cp .env.example .env && chmod 600 .env   # then fill it in
#   docker compose --profile tunnel up -d    # on the Droplet (update.sh does this)
#   docker compose up -d                     # without the tunnel (local testing)
#
# Nothing publishes a port on the host: the app is reached only through the tunnel, which
# connects out to Cloudflare. Every image is pinned by tag and digest (update both
# together); the app image comes from CLIMPACT_IMAGE in .env.

name: climpact

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by every service that runs the app image (web, worker, migrate, purge).
x-app: &app
  image: ${CLIMPACT_IMAGE:?set CLIMPACT_IMAGE in .env}
  environment: &app-env
    CLIMPACT_WEB_SECRET_KEY: ${CLIMPACT_WEB_SECRET_KEY:?set CLIMPACT_WEB_SECRET_KEY in .env}
    CLIMPACT_WEB_ALLOWED_HOSTS: ${CLIMPACT_WEB_ALLOWED_HOSTS:-climpact.app}
    CLIMPACT_WEB_CSRF_TRUSTED_ORIGINS: ${CLIMPACT_WEB_CSRF_TRUSTED_ORIGINS:-https://climpact.app}
    CLIMPACT_WEB_HSTS_SECONDS: ${CLIMPACT_WEB_HSTS_SECONDS:-31536000}
    CLIMPACT_WEB_CSP_REPORT_ONLY: ${CLIMPACT_WEB_CSP_REPORT_ONLY:-false}
    CLIMPACT_WEB_CF_WEB_ANALYTICS: ${CLIMPACT_WEB_CF_WEB_ANALYTICS:-true}
    CLIMPACT_WEB_MAX_UPLOAD_MB: ${CLIMPACT_WEB_MAX_UPLOAD_MB:-50}
    CLIMPACT_WEB_RETENTION_DAYS: ${CLIMPACT_WEB_RETENTION_DAYS:-7}
    CLIMPACT_WEB_LOG_LEVEL: ${CLIMPACT_WEB_LOG_LEVEL:-INFO}
    # Abuse limits (#125): Turnstile is off while its keys are empty.
    CLIMPACT_WEB_TURNSTILE_SITE_KEY: ${CLIMPACT_WEB_TURNSTILE_SITE_KEY:-}
    CLIMPACT_WEB_TURNSTILE_SECRET_KEY: ${CLIMPACT_WEB_TURNSTILE_SECRET_KEY:-}
    CLIMPACT_WEB_MAX_ACTIVE_JOBS_PER_IP: ${CLIMPACT_WEB_MAX_ACTIVE_JOBS_PER_IP:-2}
    CLIMPACT_WEB_MAX_DAILY_JOBS_PER_IP: ${CLIMPACT_WEB_MAX_DAILY_JOBS_PER_IP:-50}
    CLIMPACT_WEB_MAX_QUEUED_JOBS: ${CLIMPACT_WEB_MAX_QUEUED_JOBS:-20}
    CLIMPACT_WEB_MIN_FREE_DISK_GB: ${CLIMPACT_WEB_MIN_FREE_DISK_GB:-2}
    CLIMPACT_WEB_JOB_TIME_LIMIT_MINUTES: ${CLIMPACT_WEB_JOB_TIME_LIMIT_MINUTES:-60}
    DATABASE_URL: ${DATABASE_URL:-postgres://climpact:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/climpact}
  volumes:
    - media:/var/lib/climpact/media
  tmpfs:
    - /tmp:size=256m,mode=1777
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  logging: *logging

services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    environment:
      POSTGRES_USER: climpact
      POSTGRES_DB: climpact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    shm_size: 64m
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "climpact", "-d", "climpact"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

  # One-off: apply migrations, then exit; web and worker start only once it has succeeded.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image's HEALTHCHECK fetches /healthz (app and database up).
    # egress: the only way out of the app, for Turnstile's siteverify check
    # (challenges.cloudflare.com, #125). The worker, migrate and purge stay on backend only.
    networks: [backend, egress]
    deploy:
      resources:
        limits:
          memory: 768m

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM (a deploy, a reboot) sets the worker's stop flag: the running job stops at
    # its next progress step and is queued again, and the next worker runs it. A stage
    # that reports no progress can't be interrupted, so allow two minutes; past that,
    # Docker kills the worker, and the next one marks the job failed (no heartbeat for
    # JOB_STALE_SECONDS) with a retry offered.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g

  # Daily purgejobs (expired jobs and their folders, and jobs whose worker died). The
  # worker also purges hourly; this keeps the daily run going when the worker is down.
  # The shell sleeps between runs, so the Python process exists only while purging.
  purge:
    <<: *app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - trap 'exit 0' TERM INT;
        while :; do climpact-entrypoint purge || echo "purge failed" >&2;
        sleep 86400 & wait $$!; done
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image's check would look for a web server; a running shell is healthy, so
    # `docker compose up --wait` works.
    healthcheck:
      test: ["CMD", "true"]
      interval: 5m
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512m

  # The deploy hook (#126): https://climpact.app/_deploy, routed here by the tunnel. It
  # checks the release workflow's signature and drops the version into ./hook, where
  # the host's climpact-deploy.path unit picks it up and runs update.sh. The hook itself
  # runs nothing, has no route out and no Docker socket. Same Python base image as the
  # app's Dockerfile (pinned by tag and digest; update both together), so its layers are
  # already on the Droplet. ./hook comes from `sudo update.sh --install-hook`.
  deploy-hook:
    image: python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    command: ["python", "-I", "/opt/deploy-hook.py"]
    restart: unless-stopped
    user: "10001:10001"
    environment:
      # Not `:?`: without it the hook answers 503 and the rest of the stack still runs.
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./deploy-hook.py:/opt/deploy-hook.py:ro
      - ./hook:/run/hook
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  # The Cloudflare Tunnel connector: dials out to Cloudflare and forwards the public
  # hostname (configured on the tunnel, in Cloudflare) to http://web:8000, and its path
  # _deploy to http://deploy-hook:9000. Off unless the
  # `tunnel` profile is on, so the stack runs locally without a tunnel token.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      # Not `:?`: Compose reads the whole file even when the profile is off.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

networks:
  # No route out: the database, the worker, the deploy hook and the one-off jobs talk
  # only to each other, to web and to cloudflared (web also joins egress, for Turnstile).
  backend:
    internal: true
  # The way out to the internet: cloudflared's to Cloudflare, and web's for Turnstile.
  egress: {}

volumes:
  pgdata: {}
  media: {}
