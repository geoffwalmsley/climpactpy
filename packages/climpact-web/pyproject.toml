[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climpact-web"
description = "Web front end for climpactpy (Climpact in Python)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "climpactpy[plots]",  # the core package (import name: climpact), with matplotlib
    # for the plots and the PDF report (#79)
    "django>=6.0,<6.1",  # 6.0 (needs Python 3.12, the minimum since #117)
    "waitress>=3.0",  # the local server started by `climpact-web`
    "whitenoise>=6.7",  # static files: hashed, compressed copies (#82)
    "brotli>=1.1",  # Brotli copies of the static files, made by collectstatic (#82)
    "dj-database-url>=2.2",  # DATABASE_URL in hosted mode
    "platformdirs>=4.2",  # the user data folder in local mode
    "markdown>=3.6",  # the help guides (#81)
]

[project.scripts]
climpact-web = "climpact_web.cli:main"

[project.optional-dependencies]
# Hosted mode on Postgres (DATABASE_URL=postgres://...)
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# The web package's development tools (PEP 735). The root pyproject.toml's group has these too.
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
    # The accessibility tests (#83) drive the installed Chrome over the DevTools protocol.
    "websocket-client>=1.8",
]

[project.urls]
Repository = "https://github.com/geoffwalmsley/climpactpy"

[tool.uv.sources]
climpactpy = { workspace = true }

[tool.hatch.version]
path = "src/climpact_web/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/climpact_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE --strict-markers"
DJANGO_SETTINGS_MODULE = "web_test_settings"
pythonpath = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
