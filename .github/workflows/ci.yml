name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    # gitleaks over the whole git history (#138), with the allowlist in .gitleaks.toml.
    # The pinned release binary, installed only if its SHA-256 matches the hash below (from
    # the release's gitleaks_<version>_checksums.txt); no third-party action, no licence key,
    # read-only token. --redact keeps any finding's value out of the (public) log.
    # Upgrade only in a deliberate pull request that changes VERSION and SHA256 together.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner --verbose .

  core:
    # The core package on its own: installed without climpact-web, full suite including
    # the R parity tests.
    # Pinned to the glibc of the R reference image (Ubuntu 24.04, glibc 2.39): the exact
    # text checks for SPI/SPEI depend on the C maths library (packages/climpact/tests/libm.py, TECHNICAL.md).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: uv.lock is up to date
        run: uv lock --check
      - name: Install the core package only
        # The climpactpy member with its own dev group, not the workspace root's group
        # (which adds climpact-web)
        run: uv sync --locked --package climpactpy
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Core does not import climpact_web
        run: |
          uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('climpact_web') is not None)"
          ! grep -rnE "^\s*(import|from)\s+climpact_web\b" packages/climpact
      - name: Test
        run: uv run --no-sync pytest packages/climpact

  web:
    # Both packages installed together, as in development; runs the web package's tests.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install both packages
        run: uv sync --locked
      - name: Compiled stylesheet is up to date
        # The pinned standalone Tailwind CLI (#118), installed only if its SHA-256 matches;
        # css/climpact.css is committed, so rebuilding it must change nothing.
        run: |
          scripts/fetch-tailwind.sh
          scripts/build-css.sh
          git diff --exit-code -- packages/climpact-web/src/climpact_web/core/static/climpact_web/css/
      - name: Test
        env:
          CLIMPACT_REQUIRE_TAILWIND: "1"
        run: >-
          uv run --no-sync pytest packages/climpact-web
          --ignore=packages/climpact-web/tests/test_page_budget.py
          --ignore=packages/climpact-web/tests/test_accessibility.py
      - name: Page size budget
        # The low-bandwidth budget (#82): every page type with what it links, gzipped, and
        # each static file; fails over budget and prints the sizes (TECHNICAL.md, "Size budget").
        run: uv run --no-sync pytest packages/climpact-web/tests/test_page_budget.py
      - name: Django checks
        env:
          CLIMPACT_WEB_DATA_DIR: ${{ runner.temp }}/climpact-web
        run: |
          mkdir -p "$CLIMPACT_WEB_DATA_DIR"
          uv run --no-sync climpact-web manage check
          uv run --no-sync climpact-web manage makemigrations --check --dry-run

  web-accessibility:
    # The accessibility checks (#83): axe-core, keyboard, reflow, forced-colours,
    # reduced-motion and progress checks of every page type, with the sample station,
    # batch and grid run through the worker, in the runner's preinstalled Google Chrome
    # driven over the DevTools protocol (TECHNICAL.md, "Accessibility"). Fails on a
    # serious or critical axe violation, or any other finding; the report and screenshots
    # are kept as an artifact.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.12"
      - name: Install both packages
        run: uv sync --locked
      - name: Find Chrome
        run: |
          echo "CHROME=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Accessibility checks
        env:
          CLIMPACT_A11Y_REQUIRE_CHROME: "1"
          CLIMPACT_A11Y_REPORT: ${{ runner.temp }}/accessibility
        run: uv run --no-sync pytest packages/climpact-web/tests/test_accessibility.py -rs
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: ${{ runner.temp }}/accessibility
          if-no-files-found: ignore

  web-postgres:
    # Hosted mode against a real Postgres (a service container): the settings read
    # DATABASE_URL, migrations apply and the health check reaches the database.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: climpact
          POSTGRES_PASSWORD: climpact
          POSTGRES_DB: climpact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climpact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLIMPACT_WEB_MODE: hosted
      CLIMPACT_WEB_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      CLIMPACT_WEB_ALLOWED_HOSTS: localhost
      CLIMPACT_WEB_STATIC_ROOT: ${{ github.workspace }}/staticfiles
      CLIMPACT_WEB_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://climpact:climpact@localhost:5432/climpact
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.12"
      - name: Install both packages with the postgres extra
        # The web member and its dependencies (the core), without any dev group
        run: |
          uv sync --locked --package climpact-web --extra postgres --no-default-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Migrate, collect static files, health check
        run: |
          climpact-web manage check --deploy
          climpact-web manage migrate --no-input
          climpact-web manage collectstatic --no-input
          climpact-web manage shell -c "
          from django.test import Client
          r = Client().get('/healthz', HTTP_HOST='localhost')
          print(r.status_code, r.json())
          assert r.status_code == 200 and r.json()['database'] == 'ok'
          "
      - name: Run a station job through the worker (claims with SELECT ... FOR UPDATE SKIP LOCKED)
        run: |
          climpact-web manage shell -c "
          import shutil
          from climpact_web.jobs.models import Job
          job = Job.objects.create(kind='station', owner='ci', params={
              'station_file': 'station.txt',
              'metadata': {'name': 'madrid', 'latitude': 40.4, 'base_start': 1971, 'base_end': 2000},
              'zip': True})
          job.input_dir.mkdir(parents=True)
          shutil.copy('reference/input/madrid_retiro_1961-2020.txt', job.input_dir / 'station.txt')
          "
          climpact-web manage runworker --once
          climpact-web manage shell -c "
          from climpact_web.jobs.models import Job
          job = Job.objects.get()
          print(job.status, job.step, job.total, job.result.get('zip'))
          assert job.status == 'succeeded' and job.step == job.total, job.log
          "
      - name: Several workers on Postgres (#119)
        # Real worker processes competing for claims, one killed mid-job; the test makes
        # and drops a database of its own. REQUIRED makes a missing URL fail, not skip.
        env:
          CLIMPACT_TEST_POSTGRES_REQUIRED: "1"
        run: |
          uv sync --locked --package climpact-web --extra postgres
          uv run --no-sync pytest packages/climpact-web/tests/test_queue_postgres.py -v -rs
