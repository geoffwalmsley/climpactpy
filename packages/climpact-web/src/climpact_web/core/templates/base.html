{% load i18n static ui %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{% translate "Climpact" %}{% endblock %}{% block title_suffix %} &middot; {% translate "Climpact" %}{% endblock %}</title>
  <link rel="icon" href="{% static 'climpact_web/icons/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'climpact_web/css/climpact.css' %}">
  {# htmx without eval, inline scripts or the <style> it would inject (the Content Security Policy, #137). #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  {# The theme the user picked (ui.js), applied before the page paints: a blocking script. #}
  <script src="{% static 'climpact_web/js/theme.js' %}"></script>
  <script src="{% static 'climpact_web/vendor/htmx/htmx.min.js' %}" defer></script>
  <script src="{% static 'climpact_web/js/ui.js' %}" defer></script>
  <script src="{% static 'climpact_web/js/drawer.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="skip-link print:hidden" href="#main">{% translate "Skip to main content" %}</a>
  {% block header %}
  {# The app shell (#227): Climpact, then Workspaces and Gridded; Index reference and Help at the end, with the theme toggle. The logo goes to the landing page. #}
  <header class="site-header print:hidden">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'core:home' %}">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8"/><path d="M6 21h4l3-9 4 13 3-17 2 9h4"/></svg>
        <span>{% translate "Climpact" %}</span>
      </a>
      {% if nav_items %}
      <nav class="site-nav" aria-label="{% translate 'Main' %}">
        <ul>
          {% for item in nav_items %}
          <li><a href="{{ item.url }}" data-nav="{{ item.key }}"{% if item.current %} aria-current="{{ item.current }}"{% endif %}>{{ item.label }}</a></li>
          {% endfor %}
        </ul>
      </nav>
      {% endif %}
      <div class="site-header__tools">
        {% if index_reference_url %}<a class="site-header__link site-header__reference" href="{{ index_reference_url }}">{% translate "Index reference" %}</a>{% endif %}
        {% if page_help %}{# The page's guide (#197): the help system's visible home. #}
        {% if page_help.title %}{% blocktranslate with title=page_help.title asvar app_help_name %}Help: {{ title }}{% endblocktranslate %}{% else %}{% translate "Help" as app_help_name %}{% endif %}
        <a class="site-header__link" id="app-help" href="{{ page_help.url }}" aria-label="{{ app_help_name }}"{% if page_help.current %} aria-current="page"{% endif %}>{% translate "Help" %}</a>
        {% endif %}
        {% include "components/theme_toggle.html" %}
        {% if show_language_switcher %}
        {% include "core/language_switcher.html" %}
        {% endif %}
      </div>
      {% if nav_items %}
      {# Below 600px the links above are hidden and this menu shows them, with Index reference; <details> needs no JavaScript. The theme toggle moves into it too, so the brand keeps its room (#203). #}
      <details class="site-menu">
        <summary class="button button--secondary button--sm">{% icon "menu" %}<span class="site-menu__label">{% translate "Menu" %}</span></summary>
        <div class="site-menu__panel">
          <nav aria-label="{% translate 'Main' %}">
            <ul>
              {% for item in nav_items %}
              <li><a href="{{ item.url }}"{% if item.current %} aria-current="{{ item.current }}"{% endif %}>{{ item.label }}</a></li>
              {% endfor %}
              {% if index_reference_url %}<li><a href="{{ index_reference_url }}">{% translate "Index reference" %}</a></li>{% endif %}
            </ul>
          </nav>
          <div class="site-menu__theme"><span aria-hidden="true">{% translate "Colour theme" %}</span>{% include "components/theme_toggle.html" %}</div>
        </div>
      </details>
      {% endif %}
    </div>
  </header>
  {% endblock %}
  {% block steps %}{% endblock %}
  {# The page and the help drawer beside it (below it on narrow screens), #177. #}
  <div class="drawer-layout" data-drawer-layout>
    <main id="main" class="site-main" tabindex="-1">
      {# A data page (a station's sections, data_page) uses the whole window (#227, #263); the others 72rem. #}
      <div class="mx-auto w-full {% if not data_page %}max-w-content {% endif %}px-4 sm:px-6">
        {% include "components/messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>
    {% include "components/drawer.html" %}
  </div>
  {% block footer %}
  <footer class="site-footer print:hidden">
    <div class="mx-auto w-full max-w-content px-4 sm:px-6 site-footer__inner">
      <p>{% blocktranslate trimmed %}
        Climpact calculates the climate indices defined by the WMO Expert Team on
        Sector-specific Climate Indices (ET-SCI).
      {% endblocktranslate %}</p>
      <p>{% blocktranslate with version=climpact_web_version %}Climpact web, version {{ version }}{% endblocktranslate %}</p>
      {% url 'help:guide' 'accessibility' as accessibility_url %}{% if accessibility_url %}<p><a href="{{ accessibility_url }}">{% translate "Accessibility" %}</a></p>{% endif %}
    </div>
  </footer>
  {% endblock %}
  {% include "components/toasts.html" %}
  {% block scripts %}{% endblock %}
</body>
</html>
