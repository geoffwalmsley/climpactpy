# The uv workspace (#116): the two packages under packages/ share one lockfile (uv.lock)
# and one virtualenv (.venv). The root is not a package itself; `uv sync` installs both
# members, editable, with the development tools below.
[tool.uv.workspace]
members = ["packages/climpact", "packages/climpact-web"]

[tool.uv.sources]
climpact = { workspace = true }
climpact-web = { workspace = true }

[dependency-groups]
# Development: both packages with their own `dev` groups' tools. The core's group is
# also installed on its own by CI's core job (`uv sync --package climpact`).
dev = [
    "climpact",
    "climpact-web",
    # Below 9.2 until pytest-xdist releases its fix for pytest 9.2 node ids (pytest-xdist
    # #1386, fixed after 3.8.0): with 3.8.0 and pytest 9.2, --dist loadgroup ignores xdist_group.
    "pytest>=8,<9.2",
    "pytest-django>=4.9",
    # Runs the tests in parallel (-n auto in the pytest settings, #181)
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "matplotlib>=3.8",
    "websocket-client>=1.8",
]
