[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climpact"
description = "Climpact for Python: indices of daily climate extremes for station and gridded data (a port of the R Climpact)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Geoff Walmsley" }]
maintainers = [{ name = "Geoff Walmsley" }]
keywords = ["climate", "climate extremes", "ETCCDI", "ET-SCI", "Climpact", "indices"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "xclim>=1.0,<1.1",
    "xarray>=2025.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "dask>=2024.1",
    "netCDF4>=1.7",
]

[project.scripts]
climpact = "climpact.cli:main"

[project.optional-dependencies]
# Index plots, the combined PDF (climpact.plots; `climpact run --plots`)
plots = [
    "matplotlib>=3.8",
]

[dependency-groups]
# The core's development tools (PEP 735; `uv sync --package climpact`, or
# `pip install --group dev` with pip 25.1+). The root pyproject.toml's group has these too.
dev = [
    # Below 9.2 until pytest-xdist releases its fix for pytest 9.2 node ids (pytest-xdist
    # #1386, fixed after 3.8.0): with 3.8.0 and pytest 9.2, --dist loadgroup ignores xdist_group.
    "pytest>=8,<9.2",
    # Runs the tests in parallel (-n auto in the pytest settings, #181)
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/geoffwalmsley/climpactpy"
Issues = "https://github.com/geoffwalmsley/climpactpy/issues"
Changelog = "https://github.com/geoffwalmsley/climpactpy/blob/main/CHANGELOG.md"
"Technical notes" = "https://github.com/geoffwalmsley/climpactpy/blob/main/TECHNICAL.md"
"Original R Climpact" = "https://github.com/ARCCSS-extremes/climpact"

[tool.hatch.version]
path = "src/climpact/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/climpact"]

[tool.hatch.build.targets.sdist]
# The source and the metadata files only: the tests need the repository's reference/ data
# and are run from a checkout (scripts/check_dists.py checks the contents).
include = ["/src/climpact", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel with pytest-xdist (#181); `-n 0` runs the tests in one process
addopts = "-rfE --strict-markers -n auto --dist loadgroup"
markers = [
    "parity: comparison against the R reference outputs",
]
filterwarnings = [
    # cf_xarray warns when matplotlib is not installed (it is optional: the plots extra)
    "ignore:Import\\(s\\) unavailable to set up matplotlib support:UserWarning",
]

[tool.ruff]
# Shared settings for the whole repository (reference/ scripts and both packages)
extend = "../../ruff.toml"
