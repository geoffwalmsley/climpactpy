# An example third-party climpact plugin, used by tests/test_modules.py.
#
# It is a package of its own: it depends on climpact and registers one module of each
# kind through climpact's entry point groups. `pip install` (or `uv pip install`) it
# next to climpact and `climpact modules` lists it. The tests install it into a
# temporary folder by writing its distribution metadata (the `example_plugin` fixture in
# tests/test_modules.py), which needs no build step or network.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climpact-example-plugin"
version = "0.1.0"
description = "Example QC, homogeneity and index modules for climpact"
requires-python = ">=3.11"
dependencies = ["climpact"]

[project.entry-points."climpact.qc"]
example_qc = "climpact_example_plugin:HotDaysQC"

[project.entry-points."climpact.homogeneity"]
example_shift = "climpact_example_plugin:SHIFT"

[project.entry-points."climpact.indices"]
example_indices = "climpact_example_plugin:TXMeanIndex"
