name: Release

# Publishing a GitHub Release vX.Y.Z releases everything (#131, #122; RELEASING.md):
#
#   version ─┬─ test ──┬─ testpypi ── testpypi-check ─┬─ pypi ─┬─ assets
#            └─ build ─┘                              │        │
#                                                     └────────┴─ image ── publish ── deploy
#
# - version: the tag equals both packages' __version__ (and climpact-web's pin on the
#   core), the release's pre-release box matches the version, and the tagged commit is on
#   main. Fails before anything is built or uploaded.
# - test: the full suite (with the R parity tests) on the tagged commit.
# - build: the sdists and wheels of climpact and climpact-web, checked (contents, metadata,
#   twine check) and smoke-tested from a clean virtualenv; kept as the `dists` artifact.
# - testpypi, then (unless a pre-release) pypi: upload those files with `uv publish` and
#   Trusted Publishing (OIDC): no API token is stored anywhere. Each is the only job with
#   `id-token: write`, in its own environment; `pypi` requires the maintainer's approval.
# - testpypi-check: TestPyPI serves exactly the built files; the wheels downloaded from it
#   are smoke-tested again.
# - assets: the dists attached to the GitHub Release (the only job with `contents: write`).
# - image, publish: the climpact-web image (#122), published to
#   ghcr.io/geoffwalmsley/climpact-web only after the packages: after PyPI for a release,
#   after TestPyPI for a pre-release. Tagged X.Y.Z, and `latest` unless a pre-release.
# - deploy (#126): unless a pre-release, asks climpact.app's deploy hook to deploy X.Y.Z
#   and waits until https://climpact.app/healthz reports it (environment `production`).
#
# Pre-releases (v0.2.0rc1, with GitHub's pre-release box) go to TestPyPI and push the
# image without `latest`; they never reach PyPI and never deploy. Merges to main and pull
# requests publish and deploy nothing. A re-run skips files an index already has (uv publish --check-url).
#
# A pull request that changes this file runs a dry run: version (with v<the package
# version>), build, and the `image` job (the artifact saved); nothing is tested twice
# (ci.yml) or uploaded.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          python-version: "3.12"
      - name: Tag, versions and pre-release box agree
        id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          core=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' packages/climpact/src/climpact/__init__.py)
          web=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' packages/climpact-web/src/climpact_web/__init__.py)
          pin=$(sed -n 's/^ *"climpact\[plots\]==\([^"]*\)".*/\1/p' packages/climpact-web/pyproject.toml)
          is_pre=$(uv run --no-project --with packaging==26.0 python -I -c \
            "import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())" "$core")
          if [ "$EVENT" != release ]; then
            TAG="v$core"
            PRERELEASE=$is_pre
            echo "Dry run as release $TAG"
          fi
          echo "tag $TAG; climpact $core, climpact-web $web, pin climpact[plots]==$pin; pre-release box $PRERELEASE"
          fail=0
          if [ "$TAG" != "v$core" ] || [ "$TAG" != "v$web" ] || [ "$TAG" != "v$pin" ]; then
            echo "::error title=Version mismatch::tag $TAG, but climpact $core, climpact-web $web, pin $pin (RELEASING.md: bump them with scripts/set_version.py)"
            fail=1
          fi
          if [ "$PRERELEASE" != "$is_pre" ]; then
            echo "::error title=Pre-release mismatch::version $core is_prerelease=$is_pre, but the release's pre-release box is $PRERELEASE"
            fail=1
          fi
          if [ "$EVENT" = release ]; then
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error title=Not on main::the tagged commit $GITHUB_SHA is not on main"
              fail=1
            fi
          fi
          [ "$fail" = 0 ] || exit 1
          echo "version=$core" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"

  test:
    # The full suite on the tagged commit (CI has run it on main already; this is the
    # release's own record). Releases only.
    if: github.event_name == 'release'
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          python-version: "3.12"
      - name: Install both packages
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q

  build:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          python-version: "3.12"
      - name: Build the sdists and wheels
        # --no-sources: built from the publishable metadata alone, not the workspace.
        run: uv build --all-packages --no-sources --no-create-gitignore --clear -o dist
      - name: Check contents and metadata
        run: |
          uv run --no-project python -I scripts/check_dists.py dist --version "$VERSION"
          uvx twine@7.0.0 check --strict dist/*
          sha256sum dist/*
      - name: Smoke-test the wheels in a clean virtualenv
        run: scripts/smoke_dists.sh dist 3.12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dists
          path: dist/
          retention-days: 30
          if-no-files-found: error

  testpypi:
    # Every release, pre-releases too. Trusted Publishing: TestPyPI's publisher for each
    # project names this repository, release.yml and the environment `testpypi`.
    if: github.event_name == 'release'
    needs: [version, test, build]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/climpact-web/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: dist
      - name: Upload to TestPyPI
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

  testpypi-check:
    # TestPyPI serves the built files, and the wheels downloaded from it install and run.
    needs: [version, testpypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: ${{ runner.temp }}/dist
      - name: TestPyPI serves the built files
        run: >-
          uv run --no-project python -I scripts/fetch_published.py https://test.pypi.org
          "$VERSION" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/testpypi"
      - name: Smoke-test the wheels from TestPyPI
        run: scripts/smoke_dists.sh "$RUNNER_TEMP/testpypi" 3.12

  pypi:
    # Releases only, never pre-releases; waits for the maintainer's approval (the `pypi`
    # environment's required reviewer). PyPI's publisher for each project names this
    # repository, release.yml and the environment `pypi`.
    if: github.event_name == 'release' && needs.version.outputs.prerelease == 'false'
    needs: [version, testpypi-check]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/climpact-web/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: dist
      - name: Upload to PyPI
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*

  assets:
    # Attach the published dists to the GitHub Release: after PyPI, or after TestPyPI for
    # a pre-release.
    if: >-
      !cancelled() && github.event_name == 'release'
      && needs.testpypi-check.result == 'success'
      && (needs.pypi.result == 'success'
          || (needs.pypi.result == 'skipped' && needs.version.outputs.prerelease == 'true'))
    needs: [version, testpypi-check, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  image:
    # Build from the release tag, smoke-test, scan and keep the tested image as an
    # artifact; read-only token. On a release, only once the packages are published (PyPI,
    # or TestPyPI for a pre-release); on a pull request, a dry run after the build.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (github.event_name == 'pull_request'
          || (needs.testpypi-check.result == 'success'
              && (needs.pypi.result == 'success'
                  || (needs.pypi.result == 'skipped'
                      && needs.version.outputs.prerelease == 'true'))))
    needs: [version, build, testpypi-check, pypi]
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease }}
      artifact: true

  publish:
    # Push the image the `image` job tested, with the workflow's own GITHUB_TOKEN; the only
    # job with `packages: write`, and no registry secret is stored anywhere.
    if: >-
      !cancelled() && github.event_name == 'release' && needs.image.result == 'success'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/geoffwalmsley/climpact-web
      TAGS: ${{ needs.image.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/climpact-web.tar"
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        run: |
          # shellcheck disable=SC2086  # TAGS is a space-separated list
          scripts/image.sh publish climpact-web:ci "$IMAGE" $TAGS
          digest=$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$IMAGE:${TAGS%% *}" | grep -m1 "^$IMAGE@")
          {
            echo "### Image published"
            echo
            for tag in $TAGS; do echo "- \`$IMAGE:$tag\`"; done
            echo
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - name: Delete untagged versions
        # Release tags are kept, for rollback. A version is left untagged only when a tag
        # is pushed again (a re-run release); delete those. Safe while the image is a single
        # platform manifest without attestations (scripts/image.sh builds with
        # --provenance=false --sbom=false): a multi-platform image's per-platform manifests
        # are untagged versions too, and must not be deleted. Never fails the release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: /users/geoffwalmsley/packages/container/climpact-web/versions
        run: |
          if ! ids=$(gh api --paginate "$VERSIONS?per_page=100" \
              --jq '.[] | select(.metadata.container.tags | length == 0) | .id'); then
            echo "::warning title=Untagged versions::could not list the package versions"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "$VERSIONS/$id" && echo "deleted untagged version $id" \
              || echo "::warning title=Untagged versions::could not delete version $id"
          done

  deploy:
    # Last: deploy the release to climpact.app (#126). Final releases only: never a
    # pre-release, a merge to main or a pull request. POSTs the signed version to the
    # Droplet's deploy hook (through the Cloudflare Tunnel), which answers 202 and deploys
    # in the background (deploy/update.sh: migrate, start, check, roll back on failure);
    # then waits for https://climpact.app/healthz to report the version, so the job is
    # green only once the release is live. The `production` environment allows only `v*`
    # tags and holds DEPLOY_WEBHOOK_SECRET. Re-run this job to deploy the release again.
    if: >-
      !cancelled() && github.event_name == 'release'
      && !github.event.release.prerelease
      && needs.version.outputs.prerelease == 'false'
      && needs.publish.result == 'success'
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://climpact.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/call-hook.sh
          sparse-checkout-cone-mode: false
      - name: Ask the Droplet to deploy
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: sh deploy/call-hook.sh post "$VERSION"
      - name: Wait for climpact.app to report the version
        run: |
          sh deploy/call-hook.sh wait "$VERSION"
          echo "### Deployed $VERSION to https://climpact.app" >> "$GITHUB_STEP_SUMMARY"
