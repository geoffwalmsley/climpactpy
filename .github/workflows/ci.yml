name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned to the glibc of the R reference image (Ubuntu 24.04, glibc 2.39): the exact
    # text checks for SPI/SPEI depend on the C maths library (tests/libm.py, TECHNICAL.md).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
