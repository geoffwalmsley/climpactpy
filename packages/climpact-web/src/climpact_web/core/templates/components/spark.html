{# Sparkline (#78). Parameter: spark, the SVG path data from stations.results.sparkline (the series and its trend line). Decorative: the trend is given in words beside it. #}<svg class="spark" viewBox="0 0 240 60" preserveAspectRatio="none" aria-hidden="true" focusable="false">{% if spark.trend %}<path class="spark__trend" d="{{ spark.trend }}"/>{% endif %}{% if spark.line %}<path class="spark__line" d="{{ spark.line }}"/>{% if spark.dots %}<path class="spark__dots" d="{{ spark.dots }}"/>{% endif %}{% else %}<path class="spark__zero" d="M0 {{ spark.zero }}H240"/><path class="spark__pos" stroke-width="{{ spark.bar_width }}" d="{{ spark.pos }}"/><path class="spark__neg" stroke-width="{{ spark.bar_width }}" d="{{ spark.neg }}"/>{% endif %}</svg>
