# Running pytest from the repository root runs both packages' tests. Each package's
# pyproject.toml has the same settings for running its tests alone
# (`pytest packages/climpact`, as CI's core-only job does): keep the two in step.
[pytest]
testpaths = packages/climpact/tests packages/climpact-web/tests
# The browser accessibility checks (test_accessibility.py, about 4.5 minutes) are left out
# by default; run them with `uv run pytest -m browser` (TECHNICAL.md, "Accessibility").
# The tests run in parallel with pytest-xdist, one worker per core, with the tests that
# share a cached build kept in one worker (xdist_group, set in the conftest.py files);
# `-n 0` runs them in one process, for debugging (TECHNICAL.md, "Running the tests in parallel").
addopts = -rfE --strict-markers -m "not browser" -n auto --dist loadgroup
# climpact-web's tests (pytest-django); the core tests do not use Django
DJANGO_SETTINGS_MODULE = web_test_settings
pythonpath = packages/climpact-web/tests
markers =
    parity: comparison against the R reference outputs
    browser: drives a real Chrome against a running climpact-web; deselected by default, run with -m browser
filterwarnings =
    # cf_xarray warns when matplotlib is not installed (it is optional: the plots extra)
    ignore:Import\(s\) unavailable to set up matplotlib support:UserWarning
