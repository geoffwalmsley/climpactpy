{# A card's sparkline (#78): the series and its trend line, drawn as SVG path data in results.py. #}<svg class="spark" viewBox="0 0 240 60" preserveAspectRatio="none" aria-hidden="true" focusable="false">{% if card.spark.trend %}<path class="spark__trend" d="{{ card.spark.trend }}"/>{% endif %}{% if card.spark.line %}<path class="spark__line" d="{{ card.spark.line }}"/>{% if card.spark.dots %}<path class="spark__dots" d="{{ card.spark.dots }}"/>{% endif %}{% else %}<path class="spark__zero" d="M0 {{ card.spark.zero }}H240"/><path class="spark__pos" stroke-width="{{ card.spark.bar_width }}" d="{{ card.spark.pos }}"/><path class="spark__neg" stroke-width="{{ card.spark.bar_width }}" d="{{ card.spark.neg }}"/>{% endif %}</svg>
