{% load i18n %}{% get_current_language as LANGUAGE_CODE %}{% get_available_languages as LANGUAGES %}{% get_language_info_list for LANGUAGES as languages %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label for="language-select">{% translate "Language" %}</label>
  <select id="language-select" name="language">
    {% for language in languages %}
    <option value="{{ language.code }}" lang="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>{{ language.name_local }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="button button--secondary">{% translate "Change" %}</button>
</form>
