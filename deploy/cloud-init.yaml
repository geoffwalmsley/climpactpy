#cloud-config
# User data for the climpact Droplet (#123): Ubuntu 24.04 LTS, DigitalOcean.
# Paste this whole file into "Additional options › Add initialization scripts" when
# creating the Droplet; deploy/README.md is the runbook. It holds no secrets: user data
# is readable from the Droplet's metadata service and stored by DigitalOcean, so the
# secrets are generated on the server afterwards (climpact-init-env).
#
# What it does:
#   - a `deploy` user (sudo without password, docker group) that gets the SSH keys chosen
#     at creation; root and password logins over SSH are turned off
#   - Docker Engine and the Compose plugin from Docker's apt repository, whose signing key
#     is checked against its fingerprint
#   - 2 GB of swap, unattended security upgrades (with a 03:30 UTC reboot when needed)
#   - /opt/climpact with compose.yaml and .env.example from the repository, and the
#     helpers climpact-use (pin a release) and climpact-init-env (make .env)
#   - a weekly timer that removes app images unused for 30 days
# The daily purgejobs runs in the Compose stack (the `purge` service), not here.
#
# Progress: `cloud-init status --wait --long`; log: /var/log/cloud-init-output.log.

timezone: Etc/UTC

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades

# Keys chosen at creation go to root, and climpact-bootstrap copies them to deploy.
# disable_root is false so they are copied without cloud-init's "log in as ..." prefix;
# root logins are refused by sshd instead (10-climpact.conf below).
disable_root: false
ssh_pwauth: false

users:
  - name: deploy
    gecos: climpact deploy
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true

swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

write_files:
  - path: /etc/ssh/sshd_config.d/10-climpact.conf
    permissions: "0644"
    content: |
      # climpact (#123): keys only, no root. Read before 50-cloud-init.conf; sshd keeps
      # the first value it reads.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers deploy

  - path: /etc/sysctl.d/90-climpact.conf
    permissions: "0644"
    content: |
      # Swap is a safety net for peaks, not working memory.
      vm.swappiness = 10

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52climpact-unattended-upgrades
    permissions: "0644"
    content: |
      // climpact (#123): Ubuntu's security updates (the default) and Docker's packages.
      // dockerd's live-restore keeps the containers running while Docker is upgraded.
      Unattended-Upgrade::Origins-Pattern {
        "origin=Docker,label=Docker CE";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";

  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"}
      }

  - path: /etc/systemd/system/climpact-image-prune.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Remove container images unused for 30 days (climpact)
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --all --force --filter until=720h

  - path: /etc/systemd/system/climpact-image-prune.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Weekly removal of unused container images (climpact)

      [Timer]
      OnCalendar=Sun 04:30
      RandomizedDelaySec=30m
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /usr/local/sbin/climpact-bootstrap
    permissions: "0755"
    content: |
      #!/bin/sh
      # Runs once, from cloud-init's runcmd, as root. Safe to run again.
      set -eu

      # Docker's apt signing key (https://docs.docker.com/engine/install/ubuntu/).
      DOCKER_KEY_FPR=9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      DOCKER_KEY_URL=https://download.docker.com/linux/ubuntu/gpg
      DIR=/opt/climpact
      # Tests in a container set CLIMPACT_BOOTSTRAP_NO_SYSTEMD=1.
      NO_SYSTEMD="${CLIMPACT_BOOTSTRAP_NO_SYSTEMD:-}"

      log() { echo "climpact-bootstrap: $*"; }

      # 1. Docker's repository, its key pinned by fingerprint.
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL --retry 5 --retry-connrefused "$DOCKER_KEY_URL" -o "$tmp/docker.asc"
      # The file must hold exactly one primary key, with that fingerprint (the fpr line
      # after `pub`; its subkeys have their own).
      fprs=$(gpg --batch --show-keys --with-colons "$tmp/docker.asc" \
        | awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }')
      if [ "$fprs" != "$DOCKER_KEY_FPR" ]; then
        log "Docker's signing key file has primary key(s) '$fprs', expected $DOCKER_KEY_FPR; stopping"
        exit 1
      fi
      install -d -m 0755 /etc/apt/keyrings
      gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg "$tmp/docker.asc"
      chmod 0644 /etc/apt/keyrings/docker.gpg
      # shellcheck source=/dev/null
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
        > /etc/apt/sources.list.d/docker.list
      log "Docker repository added (key $DOCKER_KEY_FPR)"

      # 2. Docker Engine and the Compose plugin.
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-compose-plugin
      usermod -aG docker deploy

      # 3. The SSH keys chosen at creation, for deploy.
      if [ -s /root/.ssh/authorized_keys ] && [ ! -s /home/deploy/.ssh/authorized_keys ]; then
        install -d -m 0700 -o deploy -g deploy /home/deploy/.ssh
        install -m 0600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
        log "SSH keys copied to deploy"
      fi
      [ -s /home/deploy/.ssh/authorized_keys ] || log "WARNING: deploy has no SSH key; add one with the Recovery Console"

      # 4. /opt/climpact, with the Compose files from main until a release is pinned.
      install -d -m 0750 -o deploy -g deploy "$DIR"
      if [ ! -f "$DIR/compose.yaml" ]; then
        runuser -u deploy -- /usr/local/bin/climpact-use main \
          || log "WARNING: could not fetch the Compose files; run 'climpact-use main' later"
      fi

      # 5. Services.
      if [ -z "$NO_SYSTEMD" ]; then
        sysctl --system >/dev/null
        systemctl daemon-reload
        systemctl enable --now docker.service containerd.service
        systemctl restart docker.service   # picks up daemon.json if Docker was already running
        systemctl enable --now climpact-image-prune.timer unattended-upgrades.service
        install -d -m 0755 /run/sshd
        sshd -t
        systemctl try-restart ssh.service   # if not running, the next connection starts it
      fi
      log "done"

  - path: /usr/local/bin/climpact-use
    permissions: "0755"
    content: |
      #!/bin/sh
      # climpact-use vX.Y.Z | main
      #
      # Fetches compose.yaml and .env.example from that tag (or main) of the repository
      # into /opt/climpact. For a release tag it also pins CLIMPACT_IMAGE in .env to the
      # image of that release and pulls it, so the Compose file and the image always come
      # from the same release. Then: cd /opt/climpact && docker compose up -d --wait
      set -eu
      REPO="${CLIMPACT_REPO:-geoffwalmsley/climpactpy}"
      IMAGE_REPO="${CLIMPACT_IMAGE_REPO:-ghcr.io/geoffwalmsley/climpact-web}"
      DIR="${CLIMPACT_DIR:-/opt/climpact}"

      die() { echo "climpact-use: $*" >&2; exit 1; }
      ref="${1:-}"
      case "$ref" in
        main) version= ;;
        v[0-9]*.[0-9]*.[0-9]*) version="${ref#v}" ;;
        *) die "usage: climpact-use vX.Y.Z | main" ;;
      esac
      [ "$(id -un)" = deploy ] || die "run as deploy (sudo -iu deploy)"
      cd "$DIR"

      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      for f in compose.yaml .env.example; do
        url="https://raw.githubusercontent.com/$REPO/$ref/deploy/$f"
        curl -fsSL --retry 3 "$url" -o "$tmp/$f" \
          || die "could not fetch $url (is $ref published?)"
      done
      mv "$tmp/compose.yaml" "$tmp/.env.example" "$DIR/"
      echo "climpact-use: compose.yaml and .env.example from $REPO@$ref"

      [ -n "$version" ] || exit 0
      image="$IMAGE_REPO:$version"
      docker pull -q "$image" >/dev/null \
        || die "could not pull $image: is the release's image published, and the package public?"
      if [ -f .env ]; then
        umask 077
        K=CLIMPACT_IMAGE V="$image" awk '
          index($0, ENVIRON["K"] "=") == 1 { print ENVIRON["K"] "=" ENVIRON["V"]; done = 1; next }
          { print }
          END { if (!done) print ENVIRON["K"] "=" ENVIRON["V"] }' .env > .env.new
        mv .env.new .env
        echo "climpact-use: CLIMPACT_IMAGE=$image in .env"
      else
        echo "climpact-use: no .env yet; run climpact-init-env, then climpact-use $ref again"
      fi

  - path: /usr/local/bin/climpact-init-env
    permissions: "0755"
    content: |
      #!/bin/sh
      # climpact-init-env
      #
      # Makes /opt/climpact/.env from .env.example (mode 0600, owned by deploy) and fills
      # in what is still empty: a new Django secret key and Postgres password, the
      # Cloudflare Tunnel token (asked for, not echoed), and COMPOSE_PROFILES=tunnel.
      # Never changes a value already set: the Postgres password must stay the one the
      # database volume was created with. Prints which settings are set, never values.
      set -eu
      DIR="${CLIMPACT_DIR:-/opt/climpact}"
      die() { echo "climpact-init-env: $*" >&2; exit 1; }
      [ "$(id -un)" = deploy ] || die "run as deploy (sudo -iu deploy)"
      cd "$DIR"
      umask 077
      if [ ! -f .env ]; then
        [ -f .env.example ] || die "no .env.example in $DIR; run climpact-use main first"
        cp .env.example .env
      fi
      chmod 600 .env

      get() { K="$1" awk 'index($0, ENVIRON["K"] "=") == 1 { v = substr($0, length(ENVIRON["K"]) + 2) } END { print v }' .env; }
      set_() {
        K="$1" V="$2" awk '
          index($0, ENVIRON["K"] "=") == 1 { print ENVIRON["K"] "=" ENVIRON["V"]; done = 1; next }
          { print }
          END { if (!done) print ENVIRON["K"] "=" ENVIRON["V"] }' .env > .env.new
        mv .env.new .env
      }

      [ -n "$(get CLIMPACT_WEB_SECRET_KEY)" ] \
        || set_ CLIMPACT_WEB_SECRET_KEY "$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
      [ -n "$(get POSTGRES_PASSWORD)" ] || set_ POSTGRES_PASSWORD "$(openssl rand -hex 32)"
      [ -n "$(get COMPOSE_PROFILES)" ] || set_ COMPOSE_PROFILES tunnel
      if [ -z "$(get TUNNEL_TOKEN)" ] && [ -t 0 ]; then
        printf 'Cloudflare Tunnel token (input hidden, Enter to skip): '
        stty -echo; IFS= read -r token || token=; stty echo; echo
        [ -z "$token" ] || set_ TUNNEL_TOKEN "$token"
      fi

      for k in CLIMPACT_IMAGE CLIMPACT_WEB_SECRET_KEY POSTGRES_PASSWORD TUNNEL_TOKEN COMPOSE_PROFILES; do
        v=$(get "$k")
        case "$v" in
          "") echo "  $k: MISSING" ;;
          *X.Y.Z) echo "  $k: placeholder; run climpact-use vX.Y.Z" ;;
          *) echo "  $k: set" ;;
        esac
      done
      ls -l "$DIR/.env"

runcmd:
  - [/usr/local/sbin/climpact-bootstrap]

final_message: "climpact cloud-init finished after $UPTIME s; see /var/log/cloud-init-output.log"
